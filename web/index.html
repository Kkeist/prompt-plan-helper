<style>
  :root { color-scheme: only light; }
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; overscroll-behavior: none; touch-action: none; }
  #shupian-app { display: block; height: 100vh; height: 100dvh; }
</style>

<body>
<div id="shupian-app"></div>
<noscript>需要开启浏览器脚本才能使用。Please enable JavaScript.</noscript>
<script>
(function () {
  // iOS 不认 user-scalable=no：拦掉双击放大和双指缩放
  var last = 0;
  document.addEventListener('touchend', function (e) {
    var now = Date.now();
    if (now - last < 350) e.preventDefault();
    last = now;
  }, { passive: false });
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (n) {
    document.addEventListener(n, function (e) { e.preventDefault(); });
  });
})();
</script>
